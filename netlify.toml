[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  ASTRO_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "25.8.2"

[context.production]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

[dev]
  command = "npm run develop"
  targetPort = 4321
  publish = "dist"
  autoLaunch = false

[[edge_functions]]
  path = "/newsletter/"
  function = "gone"
